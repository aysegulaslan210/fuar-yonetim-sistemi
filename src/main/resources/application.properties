spring.application.name=fuar-yonetim-sistemi

spring.datasource.url=jdbc:mysql://localhost:3306/fuar_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=${spring.application.name}
info.app.description=Fuar ve Altyapi Yonetim Sistemi REST API
info.app.version=1.0.0

app.fuar.max-power-capacity-kw=5000.0
app.fuar.venue-name=Istanbul Fuar Merkezi